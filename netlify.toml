# netlify.toml

# Configurações de build
[build]
  command = "npm ci && npm run build" 
  publish = "client/dist"
  functions = "netlify/functions"

# Define a versão do Node.js para o ambiente de build.
[build.environment]
  NODE_VERSION = "18"

# Redireciona as chamadas de API para as funções
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Configurações para o ambiente de desenvolvimento local do Netlify CLI
[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  publish = "client/dist"
  functions = "netlify/functions"

