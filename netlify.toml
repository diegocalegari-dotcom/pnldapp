# netlify.toml

# Configurações de build
[build]
  command = "npm install && npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

# Redireciona as chamadas de API para as funções
# Isso é crucial para que seu front-end possa se comunicar com as funções.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Configurações para o ambiente de desenvolvimento local do Netlify CLI (opcional, mas útil)
[dev]
  framework = "#custom"
  command = "npm run dev" # Comando para iniciar o dev server localmente (se você usar o Netlify CLI)
  targetPort = 5173
  publish = "client/dist"
  functions = "netlify/functions"