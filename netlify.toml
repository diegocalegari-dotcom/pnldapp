 1 # netlify.toml
    2
    3 # Configurações de build
    4 [build]
    5   command = "npm install && npm run build"
    6   publish = "client/dist"
    7   functions = "netlify/functions"
    8
    9 # Redireciona as chamadas de API para as funções
   10 # Isso é crucial para que seu front-end possa se comunicar com as funções.
   11 [[redirects]]
   12   from = "/api/*"
   13   to = "/.netlify/functions/:splat"
   14   status = 200
   15
   16 # Configurações para o ambiente de desenvolvimento local do Netlify CLI (opcional, mas útil)
   17 [dev]
   18   framework = "#custom"
   19   command = "npm run dev" # Comando para iniciar o dev server localmente (se você usar o
      Netlify CLI)
   20   targetPort = 5173
   21   publish = "client/dist"
   22   functions = "netlify/functions"
